# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Deep Learning Accelerator (DLA) Engine"   # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "FindingSRAM"                               # Your Team name
  discord: "mpa216"                                 # Optional: Discord username (for support / communication)
  description: "Area-optimized INT8 systolic DLA (eight SRAM macros, register-file result buffer) running a pretrained MNIST GAN generator on GF180MCU, single-supply 3.3 V, wrapped behind a 4-wire serial bridge and hardened into the A56/ACV project block via the open LibreLane flow"  # Short one-line description
  lvs_config: "lvs_config.json"                     # relative path (from repo root) to the lvs_config.json file
  gf_def_ready: true            # data ready for def generation with global foundries' pad frame
  ws_def_ready: false           # data ready for def generation with wafer space pad frame (no WS frame for ACV yet)
  drc_ready: true               # data ready for integration and DRC
  lvs_ready: true               # data ready for integrated LVS

# There are 7 i/o pin types and the associated connections from the user area to the i/o pad cell
# all control signals must be connected
# ground:
#   <name> connects to DVSS
# power:
#   <name> connects to DVDD
# input_cmos: digital input with no hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# input_schmitt: digital input with hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# bidirectional: programmable drive strength PDRV[1:0] - 00: 4mA, 01: 8mA, 10: 12mA, 11: 16mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
#     <name_PDRV0>: drive strength lsb
#     <name_PDRV1>: drive strength msb
# bidirectional_24ma: fixed drive strength 24mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
# analog:
#   <name> connects to ASIG5V
#   Note: secondary_esd flag is ignored

# ======================================================
# A56 / ACV pin list (11 pads). The accelerator's 53-bit interface is wrapped
# behind a 4-wire serial bridge, so only 9 digital signals + supplies leave the
# block. Order below = the auditor's generated padframe (A56_ACV.def, 2026-08-31):
# pin 1 lands on slot W12 (bottom of the west edge), then upward. Every control
# pin (<name>_PU/_PD/_CS/_SL/_IE/_OE) is tied in rtl/dla_engine_chip.sv.
# NOTE: the template comment says "the first pin must be a ground connection";
# the Week-37 (2026-09-11) slides strike that rule through. Kept as-is (matches the
# audited DEF/GDS) pending the organizers' answer -- see README "Open question".
# DVDD/DVSS reach the block PDN through the in-margin power-pin connector welded
# at the die edge (librelane/connect_power.py).
# ======================================================
pins:
  # --- dedicated input pads ---
  - name: clk                       # W12 (gf180mcu_fd_io__in_s, schmitt)
    io_type: input_schmitt
  - name: rst_n                     # W13 (gf180mcu_fd_io__in_c, cmos)
    io_type: input_cmos

  # --- serial host link, bi_24t pads ---
  - name: SCLK                      # W14  host -> chip (serial clock, treated as data)
    io_type: bidirectional_24ma
  - name: MOSI                      # W15  host -> chip (command/address/data in)
    io_type: bidirectional_24ma
  - name: CS_N                      # W16  host -> chip (frame select, active low)
    io_type: bidirectional_24ma
  - name: MISO                      # W17  chip -> host (READ_C result out)
    io_type: bidirectional_24ma

  # --- status outputs, bi_24t pads ---
  - name: busy                      # W18  chip -> host (compute in progress)
    io_type: bidirectional_24ma
  - name: done                      # W19  chip -> host (tile done)
    io_type: bidirectional_24ma
  - name: wb_done                   # W20  chip -> host (writeback done)
    io_type: bidirectional_24ma

  # --- supplies: single 3.3 V domain ---
  - name: DVDD                      # W21 (gf180mcu_fd_io__dvdd)
    io_type: power
  - name: DVSS                      # W22 (gf180mcu_fd_io__dvss)
    io_type: ground
