# LibreLane Classic config for the EXPERIMENTAL full-GAN engine (gan_engine_top).
#
# Sibling of config.yaml (which hardens the main-branch dla_engine_top, 11 macros,
# 1600x1500).  This variant hardens the whole GAN -- generator + discriminator +
# 9-segment PWL activations + BCE loss/metrics -- into ONE Stage-1 macro:
#
#     13 SRAM macros = A(4x256) + B(4x256) + C(3x64)  [inside dla_engine_top]
#                    + ACT(1x1024) + IMG(1x1024)      [activations and the digit]
#
# The array runs up to FOUR batch lanes (CFG_BATCH): B's four columns hold four
# independent input vectors and C's sixteen words are four neurons x four lanes, so one
# streamed weight tile serves four images.  Weight streaming dominates run time, so this
# is a ~4x throughput win -- and right-sizing the macros pays for it, leaving the design
# SMALLER than the 16x 256x8 arrangement it replaces.
#
# Run it exactly like config.yaml, from librelane/ inside the container:
#     librelane config_gan.yaml --run-tag gan_v1
#
# >>> NOTHING BELOW HAS BEEN THROUGH PnR YET. <<<  DIE_AREA, the macro grid,
# PL_TARGET_DENSITY_PCT and CLOCK_PERIOD are sized from Yosys area estimates plus the
# measured Yosys->placed scaling of the signed-off as3v3_k256_d63 run; they are a
# reasoned starting point, not a verified floorplan.  See "FLOORPLAN SIZING" below.
meta:
  version: 3
  flow: Classic

DESIGN_NAME: gan_engine_top

PDK: gf180mcuD

# Same third-party native-3.3V standard cells as the main branch, so the whole chip
# (logic + the 3.3V OCD SRAM) runs on a single 3.3V supply.  The PDK merge documented
# in config.yaml is a prerequisite here too.
STD_CELL_LIBRARY: gf180mcu_as_sc_mcu7t3v3

# --- Synthesizable RTL ONLY -------------------------------------------------
# The testbenches, the host-side model and g300_pipeline_top are NOT listed: they are
# simulation-only ($readmemh, huge flop arrays).
VERILOG_FILES:
  # new GAN layer
  - dir::../rtl/gan_engine_top.v
  - dir::../rtl/gan_sequencer.v
  - dir::../rtl/gan_postproc.v
  - dir::../rtl/gan_pwl_act.v
  - dir::../rtl/gan_nlog.v
  - dir::../rtl/gan_metrics.v
  - dir::../rtl/gan_act_buffer.v
  - dir::../rtl/gan_img_buffer.v
  - dir::../rtl/gan_sram_1rw.v      # 64x8 and 1024x8 wrappers + blackboxes
  # unchanged INT8 MAC engine
  - dir::../rtl/dla_engine_top.v
  - dir::../rtl/dla_controller.v
  - dir::../rtl/dla_pe.v
  - dir::../rtl/dla_pe_array.v
  - dir::../rtl/dla_a_buffer_bank.v
  - dir::../rtl/dla_b_buffer_bank.v
  - dir::../rtl/dla_c_buffer_bank.v
  - dir::../rtl/gf180_sram_1rw_256x8.v

# Mandatory: selects the (* blackbox *) branch of gf180_sram_1rw_256x8.v.  Without it
# Yosys synthesises ~33k flip-flops instead of instantiating 16 hard macros.
VERILOG_DEFINES:
  - SYNTHESIS

CLOCK_PORT: clk

# --- CLOCK: retimed 60 -> 40 ns on measured slack (2026-08-01) ---------------
# 60 ns was the deliberately conservative first target, chosen because gan_postproc adds
# a path the main-branch macro does not have: register -> operand mux -> 28x20 signed
# array multiplier -> register, plausibly 25-35 ns on its own at ss_125C_3v00.
#
# Run gan_pnr_v3 measured it instead of guessing: setup WS +27.56 ns at the worst of nine
# corners, i.e. an actual critical path of 60 - 27.56 = 32.44 ns.  The array multiplier is
# NOT the bottleneck it was feared to be.  40 ns therefore leaves ~7.5 ns of margin and
# matches the main-branch macro exactly -- same clock, ~1.5x the throughput of 60 ns.
#
# If a future change pushes setup negative here, the fix is to split gan_postproc's
# multiply across two pipeline stages (it has ~248 spare cycles per neuron against the MAC
# array's 256), not to squeeze the floorplan.  Falling back to 45 or 50 ns is the cheap
# interim.
CLOCK_PERIOD: 40

# --- SRAM macro (16 instances) ----------------------------------------------
# Instance names verified by Yosys elaboration of the current RTL:
#   yosys -p 'read_verilog -DSYNTHESIS -I rtl rtl/gan_*.v rtl/dla_*.v \
#             rtl/gf180_sram_1rw_256x8.v; hierarchy -top gan_engine_top; flatten; \
#             select -list t:gf180mcu_ocd_ip_sram__sram256x8m8wm1'
# --- SRAM macros: three sizes, right-sized per bank --------------------------
# This family is fixed-width (301.3 um) and scales only in height, so area per byte
# improves steeply with depth: 64x8 = 717, 256x8 = 265, 512x8 = 189, 1024x8 = 152
# um2/byte.  Hence:
#   A, B   4x 256x8 each -- A needs four simultaneous read ports (one per weight row)
#          and B four columns (one per batch lane), so they cannot be merged.
#   C      3x 64x8       -- only N*N = 16 of 256 words are ever used; 32% smaller.
#   ACT    1x 1024x8     -- 4 lanes x 256 activations, and 43% cheaper than 4x 256x8.
#   IMG    1x 1024x8     -- one 784-pixel digit (batch 1) or four 256-byte drain
#                           windows (batch 4, where the host holds the images).
# 13 macros, 990,581 um2 -- 8.6% LESS than the 16x 256x8 arrangement it replaces,
# while adding 4x batch throughput.
#
# The 256x8 keeps pointing at the copy the signed-off Stage-1 run used; the two new
# sizes come from SRAM_MACRO/.  Instance names verified by Yosys elaboration:
#   yosys -p 'read_verilog -DSYNTHESIS -I rtl rtl/gan_*.v rtl/dla_*.v \
#             rtl/gf180_sram_1rw_256x8.v; hierarchy -top gan_engine_top; flatten; \
#             select -list t:gf180mcu_ocd_ip_sram__sram256x8m8wm1'
MACROS:
  gf180mcu_ocd_ip_sram__sram256x8m8wm1:
    gds:
      - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.gds
    lef:
      - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.lef
    lib:
      "*_tt_025C_3v30":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ff_n40C_3v60.lib
    instances:
      # 4 columns at x = 120 / 560 / 1000 / 1440 (138.7 um channels)
      # --- row 0, y = 120: A buffer, one macro per weight row ---
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[0].u_sram.u_sram":
        location: [120.0, 120.0]
        orientation: N
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[1].u_sram.u_sram":
        location: [560.0, 120.0]
        orientation: N
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[2].u_sram.u_sram":
        location: [1000.0, 120.0]
        orientation: N
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[3].u_sram.u_sram":
        location: [1440.0, 120.0]
        orientation: N
      # --- row 1, y = 520: B buffer, one macro per batch lane ---
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[0].u_sram.u_sram":
        location: [120.0, 520.0]
        orientation: N
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[1].u_sram.u_sram":
        location: [560.0, 520.0]
        orientation: N
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[2].u_sram.u_sram":
        location: [1000.0, 520.0]
        orientation: N
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[3].u_sram.u_sram":
        location: [1440.0, 520.0]
        orientation: N

  gf180mcu_ocd_ip_sram__sram64x8m8wm1:
    gds:
      - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram__sram64x8m8wm1.gds
    lef:
      - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram__sram64x8m8wm1.lef
    lib:
      "*_tt_025C_3v30":
        - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram__sram64x8m8wm1__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram__sram64x8m8wm1__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram__sram64x8m8wm1__ff_n40C_3v60.lib
    instances:
      # --- row 2, y = 920: C buffer, 3 byte planes of the 24-bit result ---
      u_dla.u_c_buffer.GEN_SRAM.GEN_D64.u_sram0.u_sram:
        location: [120.0, 920.0]
        orientation: N
      u_dla.u_c_buffer.GEN_SRAM.GEN_D64.u_sram1.u_sram:
        location: [560.0, 920.0]
        orientation: N
      u_dla.u_c_buffer.GEN_SRAM.GEN_D64.u_sram2.u_sram:
        location: [1000.0, 920.0]
        orientation: N

  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    lib:
      "*_tt_025C_3v30":
        - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../SRAM_MACRO/gf180mcu_ocd_ip_sram-main/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_3v60.lib
    instances:
      # --- row 3, y = 1250: the two deep buffers (515.81 um tall) ---
      u_act.u_sram.u_sram:
        location: [120.0, 1250.0]
        orientation: N
      u_img.u_sram.u_sram:
        location: [560.0, 1250.0]
        orientation: N

# --- FLOORPLAN SIZING --------------------------------------------------------
# Macro area, from the LEF geometry (301.3 um wide, height varies with depth):
#     A    4 x 256x8    271,086 um2
#     B    4 x 256x8    271,086
#     C    3 x  64x8    137,583      (was 3 x 256x8 = 203,314; only 16 words are used)
#     ACT  1 x 1024x8   155,414      (was 1 x 256x8; now holds 4 lanes)
#     IMG  1 x 1024x8   155,414      (was 4 x 256x8 = 271,086, and needed a bank mux)
#     TOTAL 13 macros   990,581 um2  -- 8.6% below the previous 16 x 256x8 (1,084,343)
#
# Standard cells: measured by this config's own Yosys.Synthesis step.  Calibration from
# the signed-off as3v3_k256_d63 run says the placed figure lands ~1.44x the Yosys
# estimate once taps, antenna diodes, ties and repair buffers are added.
#
#     die 1900 x 1900 = 3.61e6 um2, core ~3.50e6 um2
#     macros 990,581 + placed std cells ~830,000 = ~1.82e6 um2 instance area
#       -> instance utilisation ~52%   (signed-off reference run: 48.6%)
#
# 1900 x 1900 also drops into the Stage-2 workshop slot's 2051 x 2051 core with ~75 um
# of margin per side.  Holding all four batched images on chip instead of streaming them
# to the host would need IMG at 4 x 1024x8, pushing the die past 2000 um and out of the
# slot -- which is exactly why the strategy is "batch 4, host holds images".
FP_SIZING: absolute
DIE_AREA: [0, 0, 1900, 1900]

# Antenna-closure lever.  See librelane/GAN_PNR_SWEEP_LOG.md for the running sweep.
# Density is a RE-ROLL, not a smooth optimisation: each value changes which nets route
# long, and the violation count does not trend monotonically (the main branch saw
# 61->2, 60->5, 62->1, 63->0 on one netlist).  Changing CLOCK_PERIOD re-rolls it too,
# because the retimed netlist buffers differently.
#   60 @ 60 ns clock -> 1 net / 1 pin (1.07x, net1630 Metal2)   [run gan_pnr_v3]
#   60 @ 40 ns clock -> 2 net / 2 pin (3.24x B-SRAM Metal3 + 1.08x net1630) [gan_40ns_d60]
#   62 @ 40 ns clock -> 5 net / 5 pin (2.64x _17510_ Metal3 + 4 more)       [gan_40ns_d62]
#   58 @ 40 ns clock -> 3 net / 3 pin (1.41/1.24/1.10x, all marginal Metal3) [gan_40ns_d58]
#
# Note the 3.24x net is a B-buffer SRAM read-data broadcast -- structurally long because of
# where the macros sit, not because of how this particular placement rolled.  Density may
# well clear net1630 and leave that one standing; if so the fix is floorplan-side (B macros
# nearer the PE array, or route it above Metal3), not a further density nudge.
PL_TARGET_DENSITY_PCT: 59

GPL_CELL_PADDING: 1
DPL_CELL_PADDING: 2

# --- Power / ground ----------------------------------------------------------
VDD_NETS:
  - VDD
GND_NETS:
  - VSS
# Matches all 16 macros: u_dla.u_a_buffer...u_sram.u_sram, u_act.u_sram.u_sram,
# u_img.u_sramN.u_sram -- every instance path contains "u_sram".
PDN_MACRO_CONNECTIONS:
  - ".*u_sram.* VDD VSS VDD VSS"

PDN_MULTILAYER: false
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_EXTEND_TO: boundary

# The gf180 OCD SRAM power pins top out at Metal3, so the stock Metal4<->Metal5 macro
# grid connect makes no vias ([PDN-0232]/[PDN-0233]).  Same custom script as the main
# branch -- it is macro-cell specific, not design specific, so it covers all 16.
PDN_CFG: dir::pdn_cfg.tcl

# --- Yosys pre-synthesis check: waived, with evidence ------------------------
# Checker.YosysSynthChecks gates on Yosys's CHECK pass, which flags two things:
# combinational loops and wires with no driver.  On this design it reports 1,266
# errors and would abort the flow at stage 8.  All 1,266 are the second kind, and
# every one of them is on a Yosys-INTERNAL name generated while representing RTL
# that has not been optimised yet:
#
#   ~1,044  \sadd$func$...{.a,.b,.$result}   argument/return wires of the inlined
#                                            `sadd` function in gan_metrics.v
#     ~222  $mem2reg_{rd,wr}$...{_ADDR,_DATA} port wires left behind when the
#                                            memory pass converts the small register
#                                            files (cfg[0:15], acc[0:15],
#                                            y_fake_l/y_real_l[0:3]) into flops
#
# They are an artefact of Verilog *functions* and small register files, neither of
# which the main-branch dla_engine_top uses -- which is why config.yaml never hit
# this.  Confirmed not fixable by RTL style: rewriting `sadd` without its local reg
# and tagging the arrays (* mem2reg *) only drops 1,266 -> 966, because the residue
# is on function argument wires that exist for ANY Verilog function call.
#
# Evidence that the netlist is nonetheless correct, all from run gan_pnr_v1:
#   * ZERO combinational loops -- 1,266 of 1,266 warnings are "no driver"
#   * the POST-synthesis CHECK pass reports "Found and reported 0 problems"
#     (reports/chk.rpt) -- the artefacts are gone once opt has run
#   * Checker.YosysUnmappedCells: clear
#   * 13 macros exactly (8x256x8 + 3x64x8 + 2x1024x8), 0 inferred latches
#   * GATE-LEVEL SIMULATION of 06-yosys-synthesis/gan_engine_top.nl.v against
#     tb/gan_batch4_tb.sv: PASS, 53/53 checks -- the MAC array, the flush path
#     through gan_postproc's PWL, OP_LOADB_ACT, all four sigmoid scores and the
#     loss accumulators all behave exactly as the RTL does.
#
# So this is waived deliberately and narrowly, NOT because the check is
# inconvenient.  Re-check it if the RTL gains new modules: the waiver covers
# known-benign representation artefacts, not future real undriven logic.
ERROR_ON_SYNTH_CHECKS: false

# --- Routing / signoff -------------------------------------------------------
RT_MAX_LAYER: Metal5

# Antenna strategy carried over verbatim from the main-branch signoff: attack antennas
# PRE-route with heuristic diodes and a generous GRT repair margin, and keep the
# in-detailed-router repair OFF.  DRT_ANTENNA_REPAIR_ITERS >= 1 is a confirmed dead end
# on this design family ([DRT-0073] "No access point" -- see CLAUDE.md's antenna study).
RUN_HEURISTIC_DIODE_INSERTION: true
GRT_ANTENNA_REPAIR_MARGIN: 25
DRT_ANTENNA_REPAIR_ITERS: 0
DRT_ANTENNA_REPAIR_JUMPER_ONLY: true
DIODE_ON_PORTS: in
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
