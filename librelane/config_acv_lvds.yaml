# LibreLane Classic config -- Chipathon 2026 project A56, block "ACV", WITH THE
# LVDS RECEIVER MACRO (branch lvds-integration).
#
# = config_acv.yaml (the signed-off chip, left untouched) plus ONLY these deltas,
# each marked "LVDS:" below:
#   * RTL: rtl/dla_link_sel.v (strap sync + wake timer) and rtl/lvds_rx_x3.v
#     (SYNTHESIS -> blackbox) join VERILOG_FILES; dla_engine_chip.sv gains the
#     LINK_SEL strap and the three LVDS lanes in front of the unchanged bridge.
#   * MACROS: lvds_rx_x3 (650 x 194.2 um, macros/lvds_rx_x3/) placed as u_lvds in
#     the north-west of the core, top edge on the core top (y 875.8-1070), x
#     121.05-771.05: the "cut" -- about 8 % of the core that held standard cells
#     only -- directly under the pads N02-N07 (each RX pin sits under finger 5 of
#     its pad's ASIG5V comb, a straight drop).
#   * FP_DEF_TEMPLATE: A56_ACV_lvds.def = the organizers' official 18-pin template of 2026-11-26
#     (layout_announcement/A56.def_2026-11-26/, 73 pins, 1620 x 1110 um), written by
#     librelane/lvds/make_template.py with ONE change: each analog pin is ONE bar over its pad's
#     eight ASIG5V fingers (LibreLane makes one pin per template rectangle and the detailed router
#     rejects a signal terminal with several pins, DRT-0302, run acv_lvds1).
#   * FLOORPLAN for the official block, 55 um narrower than the 11-pin one (1620, was 1675 um):
#     DIE_AREA and CORE_AREA east edges -55 um, the SRAM grid 55 um west (same 55 um channels, same
#     19.9 um to the core edge), the old frame's NE-corner keep-out dropped (the official template
#     has no blockage, and that corner lies outside the new die). The receiver and all pins stay put.
#   * PDN_MACRO_CONNECTIONS: u_lvds VDD/VSS -> DVDD/DVSS (shared supply, handoff 14.7 v1);
#     its Metal3 straps take via3 from the Metal4 stripes like the SRAM pins.
#   * RSZ_DONT_TOUCH_RX: no resizer buffering on the analog pad nets (LVDS_*).
#   * GRT_ANTENNA_REPAIR_MARGIN 82 (antenna 0 on the LVDS layout, run acv_lvds7b) and ROUTING_CORES 4:
#     together they reproduce acv_lvds7b, the layout in gds/ on this branch.
#   * ROUTING_OBSTRUCTIONS over the receiver's top margin (Metal1-3, windows at its six RX pins), so no
#     digital wire runs beside its inputs, and over the west power-weld zone.
#
#
# Hardens dla_engine_chip: the eight-macro accelerator core (dla_engine_top,
# A x4 + B x4 SRAM, flip-flop C buffer) + the 4-wire serial bridge
# (dla_serial_bridge), flattened into ONE project-region design that presents
# the 11 ACV user pins (expanded to gf180 I/O terminals) to the organiser's
# shared padring.
#
# This SUPERSEDES the old two-stage split (Stage-1 bare core + Stage-2 generic
# 2935 workshop padring): the chipathon now assigns a per-project block (ours =
# ACV: 1675 x 1110 um for the 11-pin chip, 1620 x 1110 um in the official 18-pin
# template) and provides the real padframe.  The floorplan template
# A56_ACV.def fixes the die area + the 62 signal pins on the west/north edges;
# FP_DEF_TEMPLATE places the design against it.  Pad CELLS are in the frame,
# outside this boundary -- this design is just the project region.
#
# Everything electrical (3.3 V AS std cells, the OCD SRAM macro views, PDN,
# antenna mitigation, 40 ns clock, 55 um macro channels) is inherited from the
# signed-off longtin config (config_longtin_a3b_d50.yaml).  Paths resolve
# relative to THIS file (dir::).
meta:
  version: 3
  flow: Classic

DESIGN_NAME: dla_engine_chip

PDK: gf180mcuD

STD_CELL_LIBRARY: gf180mcu_as_sc_mcu7t3v3

# --- Synthesizable RTL: core + bridge + chip-level top -----------------------
VERILOG_FILES:
  - dir::../rtl/dla_engine_top.v
  - dir::../rtl/dla_controller.v
  - dir::../rtl/dla_pe.v
  - dir::../rtl/dla_pe_array.v
  - dir::../rtl/dla_a_buffer_bank.v
  - dir::../rtl/dla_b_buffer_bank.v
  - dir::../rtl/dla_c_buffer_bank.v
  - dir::../rtl/gf180_sram_1rw_256x8.v
  - dir::../rtl/dla_serial_bridge.v
  - dir::../rtl/dla_link_sel.v          # LVDS: strap synchroniser + receiver wake timer
  - dir::../rtl/lvds_rx_x3.v            # LVDS: hard macro (SYNTHESIS -> (* blackbox *))
  - dir::../rtl/dla_engine_chip.sv

# Force the `ifdef SYNTHESIS` branch so the A/B SRAMs elaborate as
# (* blackbox *) macros, not behavioral flip-flops.
VERILOG_DEFINES:
  - SYNTHESIS

CLOCK_PORT: clk
CLOCK_PERIOD: 40

# --- Pre-hardened GF180 SRAM macro (foundry views) ---------------------------
# EIGHT instances (4 A-rows + 4 B-cols), each 301.30 (W) x 224.93 (H) um.  Note
# the instance paths gain the "u_dla." prefix now that dla_engine_top sits one
# level below the chip-level top.
MACROS:
  gf180mcu_ocd_ip_sram__sram256x8m8wm1:
    gds:
      - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.gds
    lef:
      - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.lef
    lib:
      "*_tt_025C_3v30":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ff_n40C_3v60.lib
    instances:
      # 8-MACRO 4x2 GRID -- longtin's proven central cluster (55 um channels),
      # shifted +130 um east to open a ~245 um west routing channel for the
      # serial bridge + the west-edge signal pins (all I/O is on the west edge
      # in ACV).  A stays low (row broadcast) / B stays high (column broadcast).
      # LVDS: 55 um west of the signed-off columns (244.90 / 601.20 / 957.50 / 1313.80)
      # for the 1620 um official block; the west channel is now ~190 um.
      #   columns x = 189.90 / 546.20 / 902.50 / 1258.80   (55 um channels)
      #   rows    y = 297.57 (bottom, A) / 577.50 (top, B)  (55 um mid channel)
      # --- A buffer: 4 macros (one per matrix row), bottom row ---
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[0].u_sram.u_sram":
        location: [189.90, 297.57]
        orientation: N
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[1].u_sram.u_sram":
        location: [546.20, 297.57]
        orientation: N
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[2].u_sram.u_sram":
        location: [902.50, 297.57]
        orientation: N
      "u_dla.u_a_buffer.GEN_SRAM.GEN_A_ROWS[3].u_sram.u_sram":
        location: [1258.80, 297.57]
        orientation: N
      # --- B buffer: 4 macros (one per matrix col), top row ---
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[0].u_sram.u_sram":
        location: [189.90, 577.50]
        orientation: N
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[1].u_sram.u_sram":
        location: [546.20, 577.50]
        orientation: N
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[2].u_sram.u_sram":
        location: [902.50, 577.50]
        orientation: N
      "u_dla.u_b_buffer.GEN_SRAM.GEN_B_COLS[3].u_sram.u_sram":
        location: [1258.80, 577.50]
        orientation: N

  # LVDS: three-lane LVDS receiver hard macro (gf180mcuD 3.3 V, internals Metal1-Metal3,
  # 25 um keep-out margin built into its 650 x 194.2 um outline; package/README in
  # macros/lvds_rx_x3/). RX pins on its top edge at x 50.3/149.7/.../549.7, EN + RXk_O on
  # its bottom edge. Origin x 121.05 puts every RX pin under finger 5 (x +40.08..42.62 of
  # the pad) of N02..N07; y 875.8 puts its top edge on the core top (1070), 73 um above
  # the B-SRAM row (top 802.4). Only standard cells lived in this strip before.
  lvds_rx_x3:
    gds:
      - dir::../macros/lvds_rx_x3/gds/lvds_rx_x3.gds
    lef:
      - dir::../macros/lvds_rx_x3/lef/lvds_rx_x3.lef
    lib:
      "*_tt_025C_3v30":
        - dir::../macros/lvds_rx_x3/lib/lvds_rx_x3__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../macros/lvds_rx_x3/lib/lvds_rx_x3__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../macros/lvds_rx_x3/lib/lvds_rx_x3__ff_n40C_3v60.lib
    instances:
      u_lvds:
        location: [121.05, 875.80]
        orientation: N

# --- Floorplan: fixed by the ACV project template ----------------------------
# The template sets the 1620 x 1110 um die + the 73 pins (west edge W12-W22, north
# edge N01-N07).  DIE_AREA is set to match so the pre-template floorplan agrees.
# LVDS: 1620, was 1675 (the 11-pin frame); the official block ends before pad N17.
FP_SIZING: absolute
DIE_AREA: [0, 0, 1620, 1110]
# Shrink the core to a ~40 um die-to-core margin (was ~7 um) so a PDN core ring
# fits in that margin, right where the ACV template's die-edge power pins are.
# The 8 macros (x 189.9-1560.1, y 297.6-802.4) sit well inside this core.
# LVDS: east edge 1580, was 1635 (the same 40 um margin on the narrower die).
CORE_AREA: [40, 40, 1580, 1070]
# LVDS: the organizers' official 18-pin template, each analog pin as one bar (see header).
FP_DEF_TEMPLATE: dir::A56_ACV_lvds.def
# permissive (not strict): the PDN creates DVDD/DVSS power block-terminals in the
# design, but relocate_pins compares them against the template's NON-power pin set,
# so strict mode always flags DVDD/DVSS as spurious "extra design pins" and aborts.
# The 71 signal pins are pre-verified to match the template exactly (only DVDD/DVSS
# differ), and FP_TEMPLATE_COPY_POWER_PINS still relocates DVDD/DVSS onto the
# template's west/north power-pin positions.
FP_TEMPLATE_MATCH_MODE: permissive
FP_TEMPLATE_COPY_POWER_PINS: true
PL_TARGET_DENSITY_PCT: 50

# Cell padding for antenna-diode pin access (gf180 default is 0).
GPL_CELL_PADDING: 1
DPL_CELL_PADDING: 2

# --- Power / ground: single 3.3 V supply, named to match the ACV pads --------
# The padframe's power pin is DVDD (W21) and ground is DVSS (W22), both on the west
# edge, so the chip power/ground nets are DVDD/DVSS (not VDD/VSS).  set_global_connections and
# pdn_cfg.tcl are fully parametrized on $VDD_NET/$GND_NET, so this just renames.
VDD_NETS:
  - DVDD
GND_NETS:
  - DVSS
# Connect each SRAM macro's own VDD/VSS pins to the DVDD/DVSS chip nets.
# Format: <inst_regex> <core_power_net> <core_ground_net> <macro_power_pin> <macro_ground_pin>
PDN_MACRO_CONNECTIONS:
  - ".*u_sram.* DVDD DVSS VDD VSS"
  - "u_lvds DVDD DVSS VDD VSS"          # LVDS: shared 3.3 V supply (handoff 14.7, v1)

# LVDS: keep the resizer (buffer_ports / repair_design) off the analog pad nets:
# each LVDS_* port must reach only its u_lvds pin. The macro's digital outputs
# (RXk_O, max_capacitance 30 fF) are NOT excluded -- they need the output buffer.
RSZ_DONT_TOUCH_RX: "LVDS_.*"

# --- PDN straps + core ring --------------------------------------------------
# A DVDD/DVSS core ring in the widened die-to-core margin (see CORE_AREA) gives a
# clean power structure at the block boundary for the ACV template's die-edge
# power pins to connect to -- avoiding the congested core edge that shorted a
# direct hand-stamp. The ring requires the multilayer grid (Metal4 V + Metal5 H);
# ring widths/offsets come from the PDK (FP_PDN_CORE_RING_* = 1.6 um / 6 um).
PDN_MULTILAYER: true
PDN_CORE_RING: true
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_EXTEND_TO: core_ring

# gf180 OCD SRAM power pins top out at Metal3; connect them up to the Metal4
# vertical straps (Metal4<->Metal5 stock connect makes no vias).
PDN_CFG: dir::pdn_cfg.tcl

# --- Routing / signoff -------------------------------------------------------
RT_MAX_LAYER: Metal5
# LVDS: the layout of record (acv_lvds7b) was routed with 4 threads; the detailed router's result
# can depend on the thread count, so this pins it for an exact re-run.
ROUTING_CORES: 4

# Block-level IR-drop analysis is skipped: FP_TEMPLATE_COPY_POWER_PINS relocates
# the DVDD/DVSS pins to the template's Metal2 edge positions (where the shared
# padring delivers power), which the block's internal PDN does not via-stack to,
# so PSM reports them "unconnected" and aborts. Per OpenROAD's own note this is
# ignorable for a block that is not itself the top-level manufactured chip (the
# organiser integrates power at chip level). DRC/LVS remain the real signoff.
RUN_IRDROP_REPORT: false  # plain-harden default (PSM aborts on the pre-connector islanded pins). On the CONNECTED design IR IS measurable -- resume `--from OpenROAD.RCX` with this set true: worst DVDD drop 54.8 mV / DVSS bounce 70.6 mV @ ~125 mW, <=3.8% of 3.3 V (measured 2026-08-25, run acv_ring4).

# --- Antenna mitigation (pre-route heuristic diodes; no in-router repair) -----
RUN_HEURISTIC_DIODE_INSERTION: true
# Bumped 25 -> 50 -> 75 (2026-08-25): the new west-edge pin template re-rolled routing
# to 5 antenna nets (from 1); a more aggressive global-route diode margin inserts diodes
# on more near-limit nets pre-detailed-route.  25->5 nets, 50->3 nets (acv_ring2/3);
# 75 targets the two ~1.1x marginals to land at just net5 (the structural net the prior
# submission also shipped with).
# LVDS: 80 (2026-11-26). At 75 the LVDS layout (run acv_lvds2) kept 2 Metal3 nets over the limit
# (1.24x, 1.004x; both carried heuristic diodes, which this repair skips); 50 left 1 net (1.15x);
# 80 routed with antenna 0 (run acv_lvds5b, the phase-2 layout). Phase 3 (official 1620 um template):
# 80 gave 0 on the new floorplan (acv_lvds6a) but 2 nets (1.88x Metal4, 1.09x Metal3) once the
# receiver's top margin was blocked (acv_lvds7a); 75 left 2 nets (acv_lvds6c); 85 crashed the global
# router inside the repair (GRT-0183 "heap underflow during 3D maze routing", acv_lvds6b); 82 routes
# with antenna 0 (acv_lvds7b, the layout of record). Do not use 100: OpenROAD scales each limit by
# (1 - margin/100), and a limit of 0 means "no rule", so 100 switches the repair off.
GRT_ANTENNA_REPAIR_MARGIN: 82
DRT_ANTENNA_REPAIR_ITERS: 0
DRT_ANTENNA_REPAIR_JUMPER_ONLY: true
DIODE_ON_PORTS: in
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# --- Routing obstructions ----------------------------------------------------
# Odb.AddRoutingObstructions honours these during global + detailed routing, and
# Odb.RemoveRoutingObstructions strips them again before Magic.StreamOut (so they are
# NOT painted as metal).  Coords are in microns (layer, llx, lly, urx, ury).
# LVDS: the 11-pin frame's NE-corner Metal2 keep-out (x 1610-1675, y 1108-1110 um, the
# 2026-09-01 auditor revision) is gone: the official 18-pin template has no blockage
# (its interface file lists blockages: [] and metal2_blockages: []), and the block now
# ends at x 1620, before pad N17, so that corner lies outside the die.
ROUTING_OBSTRUCTIONS:
# LVDS: keep signal routing out of the west-margin power-weld zone (DVDD W21 y 906-979,
# DVSS W22 y 1006-1079; connect_power.py adds Metal2 reaches + via stacks there AFTER
# routing). The new LINK_SEL pin (N01, input terminal at x 33.8-34.1, y 1109-1110) sits
# right above it; without this its route could descend through the weld path. Stops at
# y 1082 so the pin stays reachable from the east; removed before streamout like the above.
- ["Metal2", 0.0, 900.0, 36.0, 1082.0]
- ["Metal3", 0.0, 900.0, 36.0, 1082.0]
# LVDS (phase 3): keep digital wires out of the receiver's top margin (chip y 1045-1070: the 25 um
# strip of its outline between its core and its top edge, where the six RX inputs run as Metal3 pin
# strips from the pads' drops down into the core). The receiver's LEF blocks only its core, and run
# acv_lvds6a routed three switching nets (a clock leaf among them) 73 um along that strip on Metal3
# (check_integration.py check 8). Metal1-Metal3 over the macro's width, with a window of +-1 um around
# each RX pin strip so its drop can land; removed before streamout like the above.
- ["Metal1", 121.05, 1045.0, 170.10, 1070.0]
- ["Metal1", 172.60, 1045.0, 269.50, 1070.0]
- ["Metal1", 272.00, 1045.0, 370.10, 1070.0]
- ["Metal1", 372.60, 1045.0, 469.50, 1070.0]
- ["Metal1", 472.00, 1045.0, 570.10, 1070.0]
- ["Metal1", 572.60, 1045.0, 669.50, 1070.0]
- ["Metal1", 672.00, 1045.0, 771.05, 1070.0]
- ["Metal2", 121.05, 1045.0, 170.10, 1070.0]
- ["Metal2", 172.60, 1045.0, 269.50, 1070.0]
- ["Metal2", 272.00, 1045.0, 370.10, 1070.0]
- ["Metal2", 372.60, 1045.0, 469.50, 1070.0]
- ["Metal2", 472.00, 1045.0, 570.10, 1070.0]
- ["Metal2", 572.60, 1045.0, 669.50, 1070.0]
- ["Metal2", 672.00, 1045.0, 771.05, 1070.0]
- ["Metal3", 121.05, 1045.0, 170.10, 1070.0]
- ["Metal3", 172.60, 1045.0, 269.50, 1070.0]
- ["Metal3", 272.00, 1045.0, 370.10, 1070.0]
- ["Metal3", 372.60, 1045.0, 469.50, 1070.0]
- ["Metal3", 472.00, 1045.0, 570.10, 1070.0]
- ["Metal3", 572.60, 1045.0, 669.50, 1070.0]
- ["Metal3", 672.00, 1045.0, 771.05, 1070.0]
