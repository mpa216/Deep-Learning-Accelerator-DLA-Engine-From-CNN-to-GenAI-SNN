# Optional manual placement for the 3 GF180 SRAM macros (C buffer).
# Format: <instance_path>  <x_um>  <y_um>  <orientation>
#
# 3-MACRO VARIANT: only the C buffer keeps SRAM (A/B are registers now).
#
# !!! The instance paths below are PREDICTED from the RTL hierarchy.
# After your first synthesis, confirm the real names with:
#
#   grep "gf180mcu_ocd_ip_sram__sram256x8m8wm1 " \
#        librelane/runs/*/*-yosys-synthesis/dla_engine_top.nl.v
#
# Fix any mismatch here, then enable this file by adding to config.yaml:
#   MACRO_PLACEMENT_CFG: dir::macro_placement.cfg
#
# Instance names VERIFIED against runs/.../06-yosys-synthesis/dla_engine_top.nl.v
# (they match the predictions below). This file is now enabled via
# MACRO_PLACEMENT_CFG in config.yaml -- the Classic flow does NOT auto-place
# hard macros, so without it PDN aborts with "[PDN-0235] unplaced macros".
#
# Die is 1000 x 700; each macro is 301.3 (W) x 224.93 (H).
# 3 in a row, vertically centred (y=240 -> spans 240..464.9). x gives symmetric
# ~24um edge margins + ~24um routing channels:
#   24 + 301.3 + 24 + 301.3 + 24 + 301.3 + 24.1 = 1000.

