    trigger: "TB1 min_headroom_v (VDS - VDsat >= 50 mV on devices carrying > 1 uA) fails at the fast / hot corners at the common-mode extremes: 23 of 987 runs in the first full run, 17 after the sizing iteration of D-013. The remaining failures are all the PMOS input pair (VIC = 0.05 V) at ff/125C, sf/125C, tt/125C at VDD 3.3-3.6 V and ff/27C at 3.6 V. R5 covers the CM / overlap gates (Option B, reduced range) and is out of proportion; R6 (constant-gm bias) is not triggered (I_lane, tPD spread, A1_min all inside, PLAN_V2 4.4)."
    measured: "sim/tb1_op/results/tb1_op (tools/tb1_quick.py table): PMOS pair margin min -85 mV (ff/125C/3.6 V, VIC 0.05 V, the steered device is 114 mV from the drain rail: slightly into triode), -37 mV (ff/125C/3.3 V), -35 mV (sf/125C/3.6 V), +14 mV (ff/125C/3.0 V), +27..36 mV elsewhere; the seven design corners keep >= 52 mV. Cause (measured op points): the resistor-diode bias raises every current by +60 % at ff/125C/3.6 V (tail 173 uA against 107 uA at tt), so the NMOS sink M3 needs 0.40 V (gm/ID 5) while the pair source sits only 0.61 V (VSG at ff/hot) above the input: M3 (needs fold node >= vdsat3 + 50 mV; 52 mV spare at the ss/125C cross corner) and the pair (needs fold node <= VS - vdsat_p - 50 mV) cannot both hold. Moving the fold voltage cannot close it: vf_tt 0.46 -> 0.40 gave pair -85 -> -25 mV but M3 at the cross corner 52 -> 5 mV (the sizing script's own assert fails). Function there is verified: TB2 A1 >= 4.78 and spread 1.59 at all 47 corners incl. VIC 0.05 V; TB3_trip, TB3_off, TB4 and TB5 pass at ff/125C/3.6 V."
    gate_relaxed: "TB1: the 50 mV margin is gated at the seven design corners (tt/27C/3.3 V, ss/125C/3.0 V, ff/-40C/3.6 V, fs/27C, sf/27C, ss + fast resistors, ff + slow resistors); at all 47 corners the margin must be >= -100 mV (a device may be at most 100 mV into triode; worst measured -85 mV). The fix that would close it is the constant-gm bias (R6) or a smaller current spread; it is not taken because its trigger has not fired."
    files_after: {spec/gates.yaml: 57132ceb91b5357feaaeb8b5eecc0db34ed1b4e5a9f338f47d1131b1a134213a}
