# decisions.yaml -- the fallback-ladder log (PLAN_V2 section 2.3) and the waiver log.
#
# HOW IT WORKS
#  * `ladder` below defines the rungs.  They are ORDERED per ladder: never skip a rung, never relax anything not listed.
#  * An agent may take the next rung of a ladder when its trigger fires TWICE IN A ROW (rule 7), measured.
#  * Taking a rung = (1) edit the frozen file(s) the rung relaxes (spec/spec.yaml and/or spec/gates.yaml),
#    (2) append ONE entry to `entries` with the date, trigger, measured value (and the file holding it), the gate relaxed,
#    and `files_after`: the new sha256 of each frozen file touched (print them with `python3 flow/lint.py --show-hashes`).
#  * flow/lint.py (rule "frozen") fails `make check` when a frozen file differs from spec/FREEZE.json AND from the
#    sha256 in the newest entry that names it.  An edit without an entry therefore cannot pass.
#  * results/REPORT.md prints every entry at the top as a waiver.
#  * A waiver (not a rung) is allowed only for something no rung covers; kind: waiver, same fields.  Prefer rungs.
#  * Ladder exhausted => the task ends with a failing gate and a report.  It never asks a question.
#
# ENTRY SCHEMA (append below, newest last)
#   - id: D-001
#     date: 2026-MM-DD
#     kind: rung | waiver | note
#     ladder: R1            # rung only
#     rung: 1               # rung only: the rung taken
#     trigger: "what fired, twice"
#     measured: "number, file"
#     gate_relaxed: "spec/spec.yaml data.margin_rate_bps 200e6 -> 150e6"
#     files_after: {spec/spec.yaml: <sha256>, spec/gates.yaml: <sha256>}

version: 1

ladder:
  R1:
    name: rate
    trigger: "TB4/TB5 miss with the extra gain stage and PMOS L = 0.28 um already used"
    rungs:
      0: "100 Mb/s, margin eye at 200 Mb/s (frozen)"
      1: "100 Mb/s, margin eye at 150 Mb/s"
      2: "80 Mb/s, then 50 Mb/s (margin check dropped, flagged)"
  R2:
    name: offset
    trigger: "area/delay trade fails"
    rungs:
      0: "sigma_total <= 5 mV design target (frozen)"
      1: "hard limit 8 mV (larger pair area)"
  R3:
    name: hysteresis
    trigger: "chatter or window miss"
    rungs:
      0: "8-25 mV (frozen)"
      1: "6-35 mV"
  R4:
    name: gain_speed
    trigger: "A1_min < 4 or f3dB < 0.8*DR"
    rungs:
      0: "baseline stages (frozen)"
      1: "add the optional extra gain stage (H7.4), variants.extra_gain_stage = true"
      2: "PMOS L 0.4 -> 0.28 um"
  R5:
    name: cm_range
    trigger: "T1 spike or TB1 CM/overlap gates fail"
    rungs:
      0: "0.05-2.35 V hybrid input + dump devices (frozen)"
      1: "Option B complementary folded cascode"
      2: "reduced range 0.05-1.6 V (PMOS-only), flagged 'deviates from TIA/EIA-644-A'"
  R6:
    name: bias
    trigger: "I_lane > 1.5 mA at ss/125C/3.6 V, or tPD variation over corners > 1.5 ns at VID 350 mV, or A1_min < 4 at a corner, and bias constancy is the lever (PLAN_V2 4.4)"
    rungs:
      0: "resistor-diode bias (frozen)"
      1: "constant-gm core, P-referenced, single core (enables TB11)"
      2: "add N-referenced core only if the fs/sf gain spread still fails"
  R7:
    name: dcd
    trigger: "skew gate fails after R4"
    rungs:
      0: "<= 5 % UI at VID 350 mV (frozen)"
      1: "<= 8 % UI"
  R8:
    name: output_edge
    trigger: "edge gate fails"
    rungs:
      0: "10-90 % <= 1.0 ns (frozen)"
      1: "<= 1.5 ns (block SDC max_transition)"
  R9:
    name: power
    trigger: "current gate fails after R6"
    rungs:
      0: "<= 1.5 mA/lane (frozen)"
      1: "<= 2.0 mA/lane"

iteration_caps:             # rule 7: logged to results/iterations.jsonl by flow/iterate.py
  per_block: 5
  per_phase: 8

entries:                    # ladder rungs and waivers taken so far (none: only T0 notes). Newest last.
  - id: D-001
    date: 2026-11-11
    kind: note
    trigger: "T0 had to turn PLAN_V2 3.1/3.2 into countable gates; points the plan table left open were decided here (no limit changed)"
    measured: "n/a (design decisions, recorded in spec/gates.yaml at freeze)"
    gate_relaxed: "none"
    decisions:
      - "TB4b added: the VID set of TB4 is {0.1, 0.35} V and cannot show 'delta tPD over VID 200-450 mV'; TB4b = worst5 x 7 VIC x VID {0.2, 0.45}."
      - "TB1 and SELFTEST use corner sets full47/worst7 (45 + the two resistor cross corners ss+res_ff, ff+res_ss) so headroom sees them; all other gates use the plain 45 / worst5 of the plan."
      - "eye15 = 5 processes x {-40C/3.6V, 27C/3.3V, 125C/3.0V}; extreme2 = ss/125C/3.0V and ff/-40C/3.6V (transient MC, PLAN_V2 3.2)."
      - "Run-count scopes of TB6-TB10 and TB12 (the plan only says ~150 + 160): TB6 4 cases, TB7 7 VIC x 3 terminations, TB7_mc N=100 x 3 VIC at worst5, TB8 6 cases, TB9 4 input voltages, TB10 nominal + 3-sigma summary, TB12 4 packages x 2 rates."
      - "Output LOW is defined as <= 0.33 V (0.1*VDD at 3.3 V) in TB8; the plan said only 'LOW'."
      - "Lane-to-lane 3-sigma skew <= 0.5 ns (PLAN_V2 3.1) is gated in TB10 as metric skew_3sigma_s (the plan's TB10 row only listed the 1 ns skew)."
      - "Metric names in gates.yaml are the contract with the testbenches; a rename needs a new note entry carrying the new gates.yaml sha256."
      - "Harness 1.1: .option wnflag=1 in the header; resistor section follows the process family; cross corners are tagged _xrff / _xrss in their names."
  - id: D-002
    date: 2026-11-11
    kind: note
    trigger: "T1 stage-1 spike (PLAN_V2 S0, C4): is the hybrid input stage with dump devices viable over VIC 0.05-2.35 V? Answer measured: yes, no ladder rung taken (R5 stays at rung 0)."
    measured: "results/spike_stage1.json, 8 corners x 47 VIC x 3 variants (1128 runs, all ok). H1 (hybrid + dump): CM span 12-31 mV (limit +-150 mV), A1 at VIC 0.05/2.35 V >= 4.26, A1 spread <= 1.27x (limit 2.2x), min saturation margin 88 mV (limit 50 mV), f3dB >= 170 MHz. H0 (no dump): CM fails at 7 of 8 corners (span up to 1.20 V), A1 0.08 at ss/125C/2.35 V. Iterations 2 of 8 (results/iterations.jsonl)."
    gate_relaxed: "none (gates.yaml untouched, sha unchanged)"
    decisions:
      - "Stage-1 topology for the real design = hybrid complementary input + dump devices gated by Vref = 0.48*VDD (build flag dump_devices defaults ON; the control H0 shows the frozen CM and gain gates fail without it). Option A stays a shake-down variant (usable up to 1.79-2.35 V depending on corner)."
      - "INTERPRETATION, not a limit change: np_overlap_v (>= 0.25 V) is the spec's own quantity, the VIC range where both pairs' TAIL transistors carry >= 90 % of plateau current. With dump devices the tails stay saturated everywhere, so TB1 must evaluate it on the dump-free control (same sizes, dump gates disconnected): measured 0.64-1.47 V (>= 0.25 at all 8 corners) AND require Vref to lie >= 0.125 V inside that window on both sides (measured >= 0.252 V). The pair hand-over width (both pairs >= 10 %) is informational: 0.19-0.31 V."
      - "s1_cm_dev_v is evaluated as span/2 (the +-0.15 V window placed optimally over the VIC sweep); the stricter reading span <= 0.15 V also passes (max span 31 mV)."
      - "Spike sizes (starting point for T2, not final): pair gm/ID 15 (NMOS L 0.5, PMOS L 0.4), tails and sinks gm/ID 7 L 1.0, cascode gm/ID 10 L 0.5, VR = 1.0 V at tt, fold node Vf 0.45 V, I3 = 1.2 Itp, Itp = Itn = 100 uA. Dump twins identical to the pair devices (a k-times-wider twin to save offset is reasoned, not simulated)."
      - "Not tested by the spike and left to T2+: mismatch (dump twins add their own sigma at the input), large-signal VID, real bias (a resistor-diode bias makes VR follow VDD - VGS; the A1 margin is only 6-11 % at sf/125C and ss/125C+res_ff), input capacitance, Monte Carlo."
  - id: D-003
    date: 2026-11-11
    kind: note
    trigger: "T2 part 1 (sizing script + netlist): design choices the plan left open or that the first numbers forced; no frozen file changed, no ladder rung taken"
    measured: "sizing/sizing_report.md (127 assertions, 0 failed), sim/t2_op/results/op_table.md (60 runs worst5 x VIC 0.05/1.2/2.35 V x EN x VID, all ok; min saturation margin 109 mV), results/iterations.jsonl phase T2"
    gate_relaxed: "none (gates.yaml / spec.yaml sha unchanged)"
    decisions:
      - "Stage 3 = current-mirror differential-to-single-ended converter (PMOS gates on the stage-2 outputs, NMOS mirror, rail-to-rail node d3) instead of the handoff's NMOS-pair + PMOS-mirror converter: with an NMOS pair at the stage-2 output level (about 2 V) d3 could not go below ~1.7 V."
      - "Stage 2 has source-degeneration resistors Rs (ppolyf_u_1k, same poly as RL and Rb). A plain pair spreads V_H,in about 4:1 over the corners (V_H2 ~ 1/(gm/ID), A1 ~ gm/ID x VR) against a 3.1:1 window (8-25 mV); with Rs the trip is partly the ratio-metric drop I_T2 x Rs and the predicted max/min ratio over the five proxy corners is 2.2:1 (sizing report section 3). Spec limits unchanged."
      - "Hysteresis window assertion applies to the 45 corners; the two resistor cross corners (not part of the 45) are reported informationally (predicted V_H,in up to 26 mV at ss/125C + res_ff)."
      - "BSIM vdsat is 0.80-0.86 x 2/(gm/ID) for NMOS L = 1 um (T1 data, 8 corners): the sizing script uses 0.86 for those devices and 1.0 elsewhere."
      - "The resistor-diode bias is held to its own predictions: t2_op shows ID within 3 % of the script for the bias devices and tails (final sizes at tt: VBN 0.912 V, VBP 2.283 V, Vref 1.584 V; mirror currents -1.9 %/+3.0 % of the script)."
      - "Build flags implemented: nmos_pair, dump_devices (tested in sim/t2_op/t2_flags). extra_gain_stage, bias=constgm, failsafe, on_die_term are declared but NOT implemented: setting one aborts the ngspice parse (a resistor with an undefined value inside a .if) and the sizing script asserts they are off."
      - "T1 variant A (PMOS only) had its M3 sinks reduced by Itn/2; the correct change is an increase by Itn/2 (RL must carry the same current as in the hybrid): fixed in sizing/lvds_rx_sizing.py (the T1 spike files are history and untouched)."
      - "Harness 1.2: ngspice prints 'Dynamic gmin stepping failed' and then often 'True gmin stepping completed' (or the transient-op fallback finishes) at the first point of a supply ramp; the run is no longer classified nonconverged when a recovery note follows the last stepping failure. Any other convergence message still is. Test added (46 tests)."
      - "DC operating points of this netlist need a supply ramp (`dc Vsup 0.3 VDD 0.1` with EN and VIC scaled by B sources) and `.option rshunt=1e11`: plain `op` fails on the regenerative stage 2 and EN = 0 leaves floating nodes. TB1 decks must do the same."
  - id: D-004
    date: 2026-11-11
    kind: note
    trigger: "T2 part 2: TB1/TB2 benches, LUT-vs-SPICE table, S1 shake-down (PMOS-only stage 1)"
    measured: "results/gates.json (TB1 147/147, TB2 35/35 PASS at smoke), results/shakedown_s1.md, sim/tb1_op/results/lut_vs_spice.md, results/iterations.jsonl phase T2 block stage3_pole"
    gate_relaxed: "none (gates.yaml / spec.yaml unchanged); no ladder rung taken"
    decisions:
      - "The PMOS-only variant (flag nmos_pair = 0) is only a shake-down vehicle of the flow (S1): its sink devices m3a have no row in the sizing script's device table and were NOT tuned. At the ss/125C + res_ff cross corner they keep only 13-34 mV of VDS - VDsat (limit 50 mV); at tt + worst5 every TB1 check passes at all 7 VIC. The baseline (hybrid input with dump) is the design; no iteration was spent on variant A."
      - "TB1 helper spec sim/tb1_op/tb1_np.json (dump-free control for the N/P overlap, decision D-002) is run by flow/run_all.py before TB1 (HELPERS) and is not itself a gate; its VIC points are not counted in the TB1 run count."
      - "Stage-3 converter pole was too slow (d3 node 39 MHz at ss/125C vs 80 MHz = 0.8 DR): L of the NMOS mirror 0.5 -> 0.28 um (sizing script variable L_n3), A3 falls 48 -> 19; the chain passes (66 MHz vs 50)."
  - id: D-005
    date: 2026-11-11
    kind: note
    trigger: "T3: benches TB3 (trip, offset), TB4 (+TB4b), TB5, TB12 written and run at the smoke tier; bench-definition choices the plan left open; no ladder rung taken, no limit changed"
    measured: "results/gates.json (smoke): TB3_trip 30/30, TB3_off 450/450, TB4 70/70, TB4b 70/70, TB5 60/60, TB12 40/40, all PASS; sim/tb*/results/*/summary.md"
    gate_relaxed: "none (gates.yaml / spec.yaml unchanged); the sizing script was not touched in T3 (no design iteration was needed)"
    decisions:
      - "TB3 offset (`vos_v`) is the input difference at which d2a - d2b crosses zero with the stage-2 cross-coupled loads scaled to m = 0.001, NOT the VDD/2 crossing of the output. Measured (sim/tb3_off/xcheck_trip_mc.json + xcheck_compare.py, 18 paired runs, same seeds, tt): d2-based minus the hysteresis-ON trip-window centre = +0.06 mV mean, 0.81 mV sd; the output-crossing definition is biased by +5.5 mV (sd 3.1) because the weak diode-loaded stage 2 lets the stage-3/inverter threshold leak into the input-referred number. The output-based value stays in the results as `vos_out_v` (report only)."
      - "TB3 trip points come from ONE continuous DC sweep per run (supply ramped inside the same sweep because plain `op` does not converge; VID triangle -150 -> +150 -> -150 mV, or the mirror), 0.1 mV steps inside +-40 mV; grid `sweep` = 0/1 selects up-first / down-first. Supply sensitivity (dvh_dvdd, dvtrip_dvdd) comes from the same sweep repeated at VDD 3.0 and 3.6 V."
      - "TB4 stimulus is applied directly at the RX pins (circuit measurement; the input network is used in TB5 and TB12). One transient holds two phases: tr = 0.4 ns edges (tpd_s = max(tPLH, tPHL), skew_s, edge_10_90_s) and the NAMED edge time (1 ns at VID 350 mV, 2 ns at VID 100 mV) for dcd_ui = |tPLH - tPHL| / UI. At VID 100 mV a +10 mV input-offset source is included in both phases. tPD is referenced to the 50 % point of the input edge at the pins."
      - "TB4b (gate TB4b, delta tPD over VID 0.2 / 0.45 V) reuses the TB4 deck and hooks (spec sim/tb4b_pd_vid)."
      - "TB5 / TB12: stimulus through netlist/input_network.spice (lvds_input_network; the lane already contains its own secondary ESD, so the *_esd variant would double it): driver emf per side VIC +- VID, 50 ohm source, 100 ohm termination, package pi-model, asig_5p0 pad. Edge times: 1 ns (VID 350 mV) / 2 ns (VID 100 mV) at 100 Mb/s, half of that at 200 Mb/s. 8 lead-in bits + one PRBS7 period (127 bits) compared. BER = bits whose output level at (nominal edge midpoint + median delay + UI/2) differs from the sent bit; toggle_diff = output crossings after data start minus input toggles. The hook was self-tested on synthetic waveforms (sim/tb5_eye/selftest_hooks.py: clean 0 errors, inverted/glitch/jitter cases detected)."
      - "TB12 uses VIC 1.2 V and VID follows the rate (0.1 V at 100 Mb/s, 0.35 V at 200 Mb/s), the two conditions for which the spec gives eye limits; pkg index 0..3 = (L, C) = (1 nH, 0.5 pF), (1, 1.5), (5, 0.5), (5, 1.5)."
      - "INTERPRETATION of the stimulus, not a limit change: both pins are kept inside the TIA/EIA-644 input range 0..2.4 V, i.e. the effective common mode is min(max(VIC, VID/2), 2.4 - VID/2). For VID = 100 mV this is the whole spec range 0.05..2.35 V (unchanged); for VID = 350 mV the grid values VIC 0.05 / 2.35 V become 0.175 / 2.225 V (reported as vic_eff_v in TB5). Reason (measured): at VIC 0.05 V, VID 350 mV the N pin sits at -0.125 V and ngspice stopped at ss/125C with `Timestep too small` at 70 % of the supply ramp (gear, gmin/reltol and slower ramp did not help); VIC 0.1 V converged. The spec's VIC test points apply to |VID| >= 100 mV per TIA 4.2.4, which does not require pins below 0 V."
      - "Transient stimuli always ramp from 0 together with the supply (a static +-VID/2 at VDD = 0 made ngspice hang at ss/125C: 7 timeouts of 300 s in the first TB4 run)."
  - id: D-006
    date: 2026-11-12
    kind: note
    trigger: "T4: benches TB6-TB10 written and run at the smoke tier; bench-definition choices the plan left open; two gates needed the waivers D-007 and D-008 (no ladder rung covers them)"
    measured: "results/gates.json (smoke): TB7 105/105, TB7_mc 450/450, TB9 20/20 (iin <= 3.9 nA, balance <= 1.3e-15 A), TB10 10/10 (skew 44 ps nominal, 3-sigma 216 ps, crosstalk 0.0008 UI), TB8 idd_en0 <= 31 nA at 125C (limit 5 uA), valid <= 30 ns (limit 1 us), no runt < 3 ns; sim/tb*/results/*/summary.md"
    gate_relaxed: "none by this entry (gates.yaml / spec.yaml sha unchanged); see D-007 and D-008"
    decisions:
      - "ngspice stall: with EN = 1 and a settled supply (TB8 cases 1, 3, 4; TB7 at ff/-40C/3.6 V, VIC 2.35 V) the transient hangs (steps of ps, > 10 min) because a decaying branch quantity of the cap_nmos model reaches the denormal range; `.option reltol=0.01` removes it (abstol, vntol, chgtol, method = gear, rshunt did not). The metrics there are rail levels and 10/90 % excursions, insensitive to 1 % tolerance. It is non-deterministic in the sense that ANY change of the deck text (here: three extra wrdata vectors and dummy resistors in a first TB8 attempt) can move the stall to another run: keep deck edits minimal and re-run the whole bench after each."
      - "TB6 measures two macro copies behind the same input network (disturbed: rails behind 1 ohm + 2 nH per rail, an assumption; reference: ideal quiet rails, static common mode); the supply disturbances are 100 mVpp 25 MHz ripple on the board supply and a 25 MHz train of 20 mA / 1 ns current spikes on the local rails. Measured: ripple <= 0.011 UI, spikes <= 0.011 UI, quiet harness 0.0002 UI, no false toggles anywhere."
      - "TB7: all three lanes see the same idle input (open = 1 Mohm to the common mode behind the 50/100 ohm network, terminated, shorted) at 7 VIC; terminated runs also drift the source +-100 mV at 0.5 mV/ns. v0 held state (reported): LOW in all 105 nominal runs; under mismatch (smoke tier: N = 30 x worst5 x 3 VIC = 450 runs) 64 runs hold 0 lanes HIGH, 176 one, 142 two, 68 three, never an intermediate level."
      - "TB9 drives the pad nodes directly (primary ESD in the path, secondary ESD inside the macro), no termination, no package; balance is 1e-15 A because the circuit is exactly symmetric in simulation (mismatch leakage is not modelled): the gate is met trivially there and says nothing about real balance. The 125C / 3.6 V supplement (tb9_input_hot, not gated) is run by flow/run_all.py."
      - "TB10: the three macro lanes carry CLK (1010), D0 and D1 (PRBS7, shifted); crosstalk = per-edge difference of lane k in the 3-lane copy against a copy where only lane k is active (shared bias and a shared 1 ohm + 2 nH supply). Pre-layout this only tests the shared bias and supply: 0.0008 UI says the bias is quiet, not that the layout is."
      - "LVS reference (request of T8b): the Vref capacitor XCVREF is emitted as nfet_03v3 w=20u l=25.13u with drain = source = bulk = VSS and gate = VREF (how the layout draws it, because the PDK MOS-capacitor cell fails foundry DRC); the simulation netlist keeps cap_nmos_03v3. Regenerated; netlist/check_lvs_ref.sh (hierarchical vs flat Netgen) still PASS: 158 devices, 77 nets, match uniquely."
  - id: D-007
    date: 2026-11-12
    kind: waiver
    trigger: "TB6 added_jitter_ui (CM step case) missed the 0.1 UI limit at 5 of 5 corners when ALL edges were counted, including 16 edges deliberately placed to coincide with the 2 ns common-mode step; no ladder rung covers it; a circuit fix is out of reach (see measured)"
    measured: "sim/tb6_cm_supply/results/tb6_cm_supply/results.json, case 0. Edges coincident with or in flight through the step (|t_edge - t_step| < 1 UI): added jitter 0.126-0.247 UI (tt 0.166, ss/125C/3.0 V 0.247, ff/-40C/3.6 V 0.126, fs 0.157, sf 0.170), worst single edge 1.0-1.67 ns late/early. Every edge >= 1 UI away from a step: 0.001-0.003 UI. No false toggles at any of the 20 runs. Cause (diag plot sim/tb6_cm_supply/diag/diag.png, tt): while the input common mode slews 1.15 V/ns the PMOS pair tail node falls 2.5 -> 0.9 V in about 2 ns and the stage-1 output stalls at zero differential until it has settled; the delay is the settling time of the hand-over, not a bias or sizing error, and the late and the early side (up steps make the edge early) both contribute so the p-p cannot be brought under 1 ns by a small change."
    gate_relaxed: "TB6 metric added_jitter_ui for case 0 is evaluated over the edges at least 1 UI (10 ns) away from every common-mode step (33 of 42 edges). The limit (0.1 UI) and the false_toggles = 0 gate (all 42 edges) are unchanged; the all-edge value is reported as added_jitter_all_ui and hit_dev_max_ps. gates.yaml untouched."
    decisions:
      - "Re-opening: if the owner wants the all-edge version gated, the lever is a faster stage-1 hand-over (more tail current, smaller pair devices), which re-opens every frozen T1-T3 result; not attempted (budget, and the worst case is a 2.3 V common-mode step in 2 ns exactly on a data edge, which no LVDS driver produces)."
  - id: D-008
    date: 2026-11-12
    kind: waiver
    trigger: "TB8 vout_off_v case 1 (VDD = 1.9 V, EN = 1) was 1.90-2.01 V (the output is HIGH for VID = +350 mV) at 5 of 5 corners; the spec row 'EN = 0 or VDD < 2.0 V: output LOW' implies an under-voltage lockout (UVLO) that the architecture does not have and no rung covers"
    measured: "sim/tb8_en/results/tb8_en/results.json, case 1: EN = 0 at VDD = 1.9 V: output <= 0.21 V at all five corners (limit 0.33 V, EN-gated parking works); EN = 1 at 1.9 V with VID = +350 mV: output 1.90-2.01 V, i.e. the macro keeps decoding validly (en1_valid_ok = 1 everywhere). Why no UVLO: an on-chip trip point has to be absolute, but every reference available on chip (device thresholds, VGS stacks) moves 25 % or more over the 45 corners, while the window between the two requirements (trip >= 2.0 V so that nothing below 2.0 V is HIGH, trip <= 3.0 V so that the lowest supply works) is only 1.5:1, so a robust trip would need a band-gap-like reference that the plan does not contain; the cost (a new block in sizing, netlist, layout) was judged out of proportion for a macro whose EN comes from the same supply domain."
    gate_relaxed: "TB8 case 1 now has EN = 0 at VDD = 1.9 V (copy b) as the gated condition; the EN = 1 copy (a) at 1.9 V is reported (vout_en1_v, en1_valid_ok). Spec row meaning: 'VDD < 2.0 V -> LOW' is guaranteed only together with EN = 0; the integrator must hold EN low until VDD >= 2.0 V (the TB8 case 5 shows the macro behaves cleanly when EN rises mid-ramp at 2.0 V: valid within 4.7-6.9 us of the EN edge at a 20 us ramp). Limits and gates.yaml untouched. To be listed in the integration notes (PLAN_V2 P7) when that phase is run."
